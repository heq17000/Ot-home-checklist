  <text x="80" y="158" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#536176">좁은 통로와 단차</text>

<rect x="130" y="250" width="940" height="340" rx="32" fill="#d0bfff" filter="url(#shadow)"/>
